# The same checks as `pnpm verify` on a laptop (spec section 11), plus the layers that the root
# `verify` script leaves out because they need Deno or a database: pgTAP, the Edge Function unit
# tests, `deno check` and the API integration tests. The iOS end-to-end flow (Maestro) is not run
# here: it needs a Mac and a simulator, so it runs by hand before each TestFlight build.
name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Deno 2.9 rewrites package.json when it resolves an npm: import from the repository root. This
    # reaches every Deno command here (`deno test` and `deno check`), not just one step.
    env:
      DENO_NO_PACKAGE_JSON: '1'
    steps:
      - uses: actions/checkout@v4

      # The pnpm version (11) comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for the web end-to-end tests
        run: pnpm --filter @pawpin/app exec playwright install --with-deps chromium

      # After checkout: the stack needs supabase/ (migrations, config, templates). The first start
      # on a database that has no `api` schema yet can fail PostgREST's health check; the second
      # start finds the migrations already applied, so one retry is enough.
      - name: Start the local Supabase stack
        run: pnpm db:start || { pnpm exec supabase stop && pnpm db:start; }

      # apps/app/.env is git-ignored, so the app and its end-to-end tests are pointed at the stack
      # here. (The service-role key the tests need is read from `supabase status` when needed.)
      - name: Point the app at the local stack
        run: |
          status="$(pnpm exec supabase status -o env)"
          value() { printf '%s\n' "$status" | grep "^$1=" | cut -d= -f2- | tr -d '"'; }
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$(value API_URL)"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$(value ANON_KEY)"
          } >> "$GITHUB_ENV"

      # Database tests first, on the database exactly as the migrations leave it.
      - name: Database tests (pgTAP)
        run: pnpm test:db

      - name: Edge Function unit tests
        run: pnpm test:functions

      - name: Type-check the Edge Functions
        run: >-
          deno check
          supabase/functions/delete-account/index.ts
          supabase/functions/storage-cleanup/index.ts

      # typecheck, lint, unit tests, then the web end-to-end tests (Playwright at 390 and 1440 px).
      - name: Verify
        run: pnpm verify

      - name: API integration tests
        run: pnpm test:api

      - name: Keep the end-to-end traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/app/e2e/.results/
          if-no-files-found: ignore
          retention-days: 7
